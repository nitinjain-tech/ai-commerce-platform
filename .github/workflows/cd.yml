name: CD — Deploy to Render

# Triggers only when CI passes on main branch
on:
  push:
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false   # never cancel an in-flight deployment

permissions:
  contents: read
  packages: write              # needed to push to GHCR

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Build & Push Docker images to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta-api.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── API image ──────────────────────────────────────────────────────────
      - name: Extract API image metadata
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/commerce-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & Push API image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Web image ──────────────────────────────────────────────────────────
      - name: Extract Web image metadata
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/commerce-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & Push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy to Render
  # Uses Render deploy hooks (set as GitHub Secrets)
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to Render"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production    # requires manual approval if configured

    steps:
      - name: Trigger Render API deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_API }}" \
          | grep -q "^2" && echo "API deploy triggered" || (echo "API deploy failed" && exit 1)

      - name: Trigger Render Web deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}" \
          | grep -q "^2" && echo "Web deploy triggered" || (echo "Web deploy failed" && exit 1)

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployed to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ✅ Deployed |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
