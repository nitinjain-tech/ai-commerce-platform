name: CI

# Runs on every push to any branch and on PRs targeting main/develop
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Test — FastAPI Backend
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: "Backend — Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commerce_admin
          POSTGRES_PASSWORD: commerce_admin_secret
          POSTGRES_DB: commerce_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: testing
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://commerce_admin:commerce_admin_secret@localhost:5432/commerce_test_db
      MIGRATION_DATABASE_URL: postgresql+asyncpg://commerce_admin:commerce_admin_secret@localhost:5432/commerce_test_db
      TEST_DATABASE_URL: postgresql+asyncpg://commerce_admin:commerce_admin_secret@localhost:5432/commerce_test_db
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: ./uploads
      CORS_ORIGINS: "http://localhost:4200"
      LOG_LEVEL: ERROR

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=app --cov-report=xml -v

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          file: apps/api/coverage.xml
          flags: backend
        continue-on-error: true  # don't fail CI if codecov is unavailable

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build — Angular Frontend
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: "Frontend — Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration=production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: apps/web/dist/web/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Docker Build Check (no push on PRs/feature branches)
  # ─────────────────────────────────────────────────────────────────────────
  docker-check:
    name: "Docker — Build Check"
    runs-on: ubuntu-latest
    # Only run on PRs (not every push to every feature branch)
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: false
          tags: commerce-api:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: commerce-web:pr-${{ github.event.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
