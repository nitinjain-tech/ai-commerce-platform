# render.yaml — Infrastructure as Code for Render.com
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy this whole stack with one click:
# → Render Dashboard > New > Blueprint > connect this repo

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  - type: web
    name: commerce-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true            # deploy automatically on push to main
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: commerce-db
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: commerce-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true     # Render auto-generates a secure random value
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /tmp/uploads
      - key: CORS_ORIGINS
        value: https://commerce-web.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: API_V1_PREFIX
        value: /api/v1
      - key: PROJECT_NAME
        value: AI Commerce Platform

  # ── Angular Frontend (Static Site) ─────────────────────────────────────────
  - type: web
    name: commerce-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    # No env vars needed — Angular is built at image-build time
    # API URL is baked into the production environment.ts

# ── PostgreSQL Database ────────────────────────────────────────────────────────
databases:
  - name: commerce-db
    plan: free                  # 1GB, expires after 90 days on free plan
    region: oregon
    databaseName: commerce_db
    user: commerce_admin
